name: WB Deals Bot

on:
  schedule:
    # Starts are redundant; one bounded session publishes every 10 minutes.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Post even if the previous post was less than 10 minutes ago
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: wb-deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python tests/run_all.py

      - name: Post one deal every 10 minutes
        shell: bash
        run: |
          for round in {1..4}; do
            started=$SECONDS
            python bot.py
            if (( round == 1 )); then
              WB_PAGES=1 WB_QUERIES_PER_RUN=4 WB_CATS_PER_RUN=2 \
                timeout 8m python scanner.py || true
            fi
            wait_for=$((600 - SECONDS + started))
            if (( round < 4 && wait_for > 0 )); then sleep "$wait_for"; fi
          done
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          WB_MIN_DISCOUNT: "50"
          WB_MIN_RATING: "4.3"
          WB_MAX_POSTS: "1"
          WB_PAGES: "2"
          WB_QUERIES_PER_RUN: "6"
          WB_CATS_PER_RUN: "3"
          WB_QUEUE_TARGET: "20"
          WB_QUEUE_MAX_AGE_HOURS: "8"
          WB_ACTIVE_HOUR_START: "0"
          WB_ACTIVE_HOUR_END: "23"
          WB_FORCE_POST: ${{ inputs.force && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Continue publishing
        if: success()
        run: gh workflow run deals.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
