name: WB Deals Bot

on:
  schedule:
    # One post every 10 minutes, around the clock: target 6 posts/hour.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Scanner and publisher must never edit the shared queue simultaneously.
  group: wb-content
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python tests/run_all.py

      - name: Post deals
        run: python bot.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          WB_MIN_DISCOUNT: "50"
          WB_MIN_RATING: "4.3"
          WB_MAX_POSTS: "1"
          WB_PAGES: "2"
          WB_QUERIES_PER_RUN: "6"
          WB_CATS_PER_RUN: "3"
          WB_QUEUE_TARGET: "60"
          WB_QUEUE_MAX_AGE_HOURS: "8"
          WB_ACTIVE_HOUR_START: "0"
          WB_ACTIVE_HOUR_END: "23"
          WB_FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
