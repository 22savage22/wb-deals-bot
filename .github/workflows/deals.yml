name: WB Deals Bot

on:
  schedule:
    # Redundant trigger only; persistent admin settings decide posting/search due.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Request one immediate post (safety gap and caps still apply)
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: wb-deals
  cancel-in-progress: false

jobs:
  deals:
    if: vars.SCHEDULER_DRIVER != 'cloudflare' && vars.SCHEDULER_DRIVER != 'cloudflare-native'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python tests/run_all.py

      - name: Run persistent-settings scheduler (bounded session)
        run: python scheduler.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          WB_SOURCE_KEY: ${{ secrets.WB_SOURCE_KEY }}
          MINIAPP_ENABLED: ${{ vars.MINIAPP_ENABLED }}
          MINIAPP_BOT_USERNAME: ${{ vars.MINIAPP_BOT_USERNAME }}
          MINIAPP_LINK_MODE: ${{ vars.MINIAPP_LINK_MODE }}
          MINIAPP_API_URL: ${{ vars.MINIAPP_API_URL }}
          MINIAPP_SYNC_KEY: ${{ secrets.MINIAPP_SYNC_KEY }}
          WB_MIN_DISCOUNT: "50"
          WB_MIN_RATING: "4.3"
          WB_MAX_POSTS: "1"
          WB_PAGES: "2"
          WB_QUERIES_PER_RUN: "6"
          WB_CATS_PER_RUN: "3"
          WB_QUEUE_TARGET: "100"
          WB_QUEUE_MAX_AGE_HOURS: "72"
          WB_SCHEDULER_ENABLED: "1"
          WB_ACTIVE_HOUR_START: "0"
          WB_ACTIVE_HOUR_END: "23"
          WB_FORCE_POST: ${{ inputs.force && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Continue publishing
        if: success()
        run: python -c "import scheduler; scheduler.dispatch_if_idle('deals.yml')"
        env:
          GITHUB_TOKEN: ${{ github.token }}
