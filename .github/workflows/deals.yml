name: WB Deals Bot

on:
  schedule:
    # 10:15, 13:15, 16:15, 19:15 and 22:15 Moscow time (UTC+3).
    - cron: "15 7,10,13,16,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wb-bot
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post deals
        run: python bot.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          WB_MIN_DISCOUNT: "50"
          WB_MIN_RATING: "4.5"
          WB_MAX_POSTS: "1"
          WB_PAGES: "2"
          WB_QUERIES_PER_RUN: "6"
          WB_CATS_PER_RUN: "3"
          GITHUB_TOKEN: ${{ github.token }}
