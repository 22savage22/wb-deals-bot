name: River Shadow learning
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-river-shadow
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: miniapp/learning-requirements.txt
      - run: pip install -r miniapp/learning-requirements.txt
      - run: python -B -m miniapp.learning_train
        env:
          MINIAPP_API_URL: ${{ vars.MINIAPP_API_URL }}
          MINIAPP_SYNC_KEY: ${{ secrets.MINIAPP_SYNC_KEY }}
