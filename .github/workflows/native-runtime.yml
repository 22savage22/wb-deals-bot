name: Native Cloudflare runtime migration and checks
on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare D1, safely check, or execute one due tick
        type: choice
        options: [prepare, diagnostic, production_recovery, check, tick, configure, post_now, recovery, admin_check, admin_invite, owner_setup, owner_check, feedback_setup, feedback_check, feedback_resolve, feedback_test]
        default: check
      post_interval_minutes:
        description: Posting interval used only by configure; preserves all other D1 settings
        type: string
        default: '10'
permissions:
  contents: read
concurrency:
  group: wb-native-migration
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -B -m miniapp.native_bootstrap
        env:
          NATIVE_ACTION: ${{ inputs.action }}
          NATIVE_POST_INTERVAL: ${{ inputs.post_interval_minutes }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MINIAPP_API_URL: ${{ vars.MINIAPP_API_URL }}
          MINIAPP_SYNC_KEY: ${{ secrets.MINIAPP_SYNC_KEY }}
          WB_SOURCE_KEY: ${{ secrets.WB_SOURCE_KEY }}
          WB_MIN_RATING: '4.3'
