name: Poller

on:
  workflow_dispatch:
  schedule:
    # Overlapping bounded sessions keep callbacks continuously covered.
    - cron: "7,37 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: wb-poller
  cancel-in-progress: false

jobs:
  poller:
    # Native Cron owns publication/leases/settings; callbacks use its webhook.
    # Keep the legacy workflow available only when deliberately migrated back.
    if: ${{ vars.SCHEDULER_DRIVER != 'cloudflare-native' && vars.SCHEDULER_DRIVER != 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python tests/run_all.py

      - name: Run poller
        run: python poller.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MINIAPP_ENABLED: ${{ vars.MINIAPP_ENABLED }}
          MINIAPP_BOT_USERNAME: ${{ vars.MINIAPP_BOT_USERNAME }}
          MINIAPP_LINK_MODE: ${{ vars.MINIAPP_LINK_MODE }}
          MINIAPP_API_URL: ${{ vars.MINIAPP_API_URL }}
          MINIAPP_SYNC_KEY: ${{ secrets.MINIAPP_SYNC_KEY }}
          WB_SOURCE_KEY: ${{ secrets.WB_SOURCE_KEY }}
          TG_CALLBACK_TRANSPORT: worker
          WB_SCHEDULER_ENABLED: "1"
          WB_SCHEDULER_DRIVER: ${{ vars.SCHEDULER_DRIVER }}
          WB_QUEUE_MAX_AGE_HOURS: "72"

      - name: Continue callback polling
        if: success()
        run: python -c "import scheduler; scheduler.dispatch_if_idle('poller.yml')"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Notify admin if callback polling failed
        if: failure()
        shell: bash
        run: |
          curl --silent --show-error --fail \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_ADMIN_ID}" \
            --data-urlencode "text=🚨 Обработчик кнопок Telegram остановился. GitHub Actions попробует запустить его снова по расписанию."
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
