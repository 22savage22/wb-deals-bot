name: Poller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: poller
  cancel-in-progress: false

jobs:
  poller:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run poller
        run: python poller.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Respawn
        if: always()
        run: GH_TOKEN="$GH_PAT" gh workflow run poller.yml --repo 22savage22/wb-deals-bot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}