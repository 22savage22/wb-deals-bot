name: Poller

on:
  workflow_dispatch:
  schedule:
    # Overlapping bounded sessions keep callbacks continuously covered.
    - cron: "7,37 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: wb-poller
  cancel-in-progress: false

jobs:
  poller:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python tests/run_all.py

      - name: Run poller
        run: python poller.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Continue callback polling
        if: always()
        run: gh workflow run poller.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
