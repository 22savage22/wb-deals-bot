name: Safe WB post preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-safe-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Send one new queued product to private admin chat only
        run: PYTHONPATH=. python tests/safe_post_preview.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          WB_SOURCE_KEY: ${{ secrets.WB_SOURCE_KEY }}
