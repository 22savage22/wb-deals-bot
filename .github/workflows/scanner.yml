name: WB Queue Scanner

on:
  workflow_dispatch:
  schedule:
    # Hourly. A full queue exits immediately, reducing WB API load.
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  # Scanner and publisher must never edit the shared queue simultaneously.
  group: wb-content
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fill vetted deal queue
        run: python scanner.py
        env:
          WB_MIN_DISCOUNT: "50"
          WB_MIN_RATING: "4.5"
          WB_PAGES: "2"
          WB_QUERIES_PER_RUN: "6"
          WB_CATS_PER_RUN: "4"
          WB_QUEUE_TARGET: "30"
          WB_QUEUE_MAX_AGE_HOURS: "8"
          GITHUB_TOKEN: ${{ github.token }}
