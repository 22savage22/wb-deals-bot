name: Schedule Runtime Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read authenticated persistent configuration and runtime (no sends/writes)
        run: PYTHONPATH=. python -B tests/probe_schedule.py
        env:
          MINIAPP_API_URL: ${{ vars.MINIAPP_API_URL }}
          MINIAPP_SYNC_KEY: ${{ secrets.MINIAPP_SYNC_KEY }}
