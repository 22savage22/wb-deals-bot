name: Tests
on:
  push:
    paths-ignore: ["state.json", "queue.json", "settings.json"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_probe:
        description: Run bounded, read-only source diagnostics
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wb_worker_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/wb-source-resilience-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify new WB products through Cloudflare Worker
        run: PYTHONPATH=. python tests/probe_worker_source.py
        env:
          WB_SOURCE_KEY: ${{ secrets.WB_SOURCE_KEY }}
  source_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.source_probe
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python tests/probe_sources.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt -r miniapp/requirements.txt
      - run: python tests/run_all.py
      - run: python -B -m unittest discover -s tests -p 'test_poller_runtime.py' -v
      - run: python -B -m unittest discover -s tests -p 'test_native_bootstrap.py' -v
      - run: python -B -m unittest discover -s tests -p 'test_schedul*.py' -v
      - run: python -B -m unittest discover -s tests -p 'test_admin_schedule.py' -v
      - run: python -m unittest discover -s tests -p 'test_miniapp*.py' -v
      - run: pip install -r miniapp/learning-requirements.txt
      - run: python -B -m unittest discover -s tests -p 'test_learning*.py' -v
      - run: node --check miniapp/static/app.js
      - run: node --test miniapp/cloudflare/*.test.mjs
      - run: npm ci --ignore-scripts && npm run check:deploy
      - run: docker build -f miniapp/Dockerfile -t finds-miniapp:test .
