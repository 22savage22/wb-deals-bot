name: Tests
on:
  push:
    paths-ignore: ["state.json", "queue.json", "settings.json"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_probe:
        description: Run bounded, read-only source diagnostics
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.source_probe
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python tests/probe_sources.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt -r miniapp/requirements.txt
      - run: python tests/run_all.py
      - run: python -m unittest discover -s tests -p 'test_miniapp*.py' -v
      - run: node --check miniapp/static/app.js
      - run: node --test miniapp/cloudflare/*.test.mjs
      - run: docker build -f miniapp/Dockerfile -t finds-miniapp:test .
